name: CI

# CI builds and runs inside the SAME devenv shell as local development
# (see devenv.sh/integrations/github-actions). The flake pins rust 1.97.1
# (rust-toolchain.toml, devenv.nix and flake.nix must stay in lockstep), so
# CI, local devenv and rustup resolve the identical toolchain — no more
# version drift (devenv 1.95 vs rustup 1.96 vs CI 1.97) or E0514.
# RUSTFLAGS=-D warnings is set globally (as setup-rust-toolchain used to do)
# so every Rust job is strict; the workspace is warning-free.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  CARGO_TERM_COLOR: always
  CARGO_REGISTRIES_CRATES_IO_PROTOCOL: sparse
  RUSTFLAGS: -D warnings

jobs:
  # ----------------- Rust jobs (devenv shell) -----------------
  fmt:
    name: "Rustfmt"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: cachix/install-nix-action@v31
      - uses: cachix/cachix-action@v16
        with:
          name: ${{ secrets.CACHIX_CACHE_NAME || 'roco' }}
          authToken: '${{ secrets.CACHIX_AUTH_TOKEN }}'
          extraPullNames: devenv
      - name: Install devenv
        run: nix profile add nixpkgs#devenv
      - name: Format Check
        run: devenv shell cargo fmt --all -- --check

  check:
    name: "Cargo Check"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: cachix/install-nix-action@v31
      - uses: cachix/cachix-action@v16
        with:
          name: ${{ secrets.CACHIX_CACHE_NAME || 'roco' }}
          authToken: '${{ secrets.CACHIX_AUTH_TOKEN }}'
          extraPullNames: devenv
      - name: Install devenv
        run: nix profile add nixpkgs#devenv
      - name: Run check
        run: devenv shell cargo check --workspace --all-targets

  clippy:
    name: "Cargo Clippy"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: cachix/install-nix-action@v31
      - uses: cachix/cachix-action@v16
        with:
          name: ${{ secrets.CACHIX_CACHE_NAME || 'roco' }}
          authToken: '${{ secrets.CACHIX_AUTH_TOKEN }}'
          extraPullNames: devenv
      - name: Install devenv
        run: nix profile add nixpkgs#devenv
      - name: Run clippy
        # --all-features works here: the devenv shell provides the GTK3
        # stack that the desktop/gui features (glib-sys/gobject-sys) need.
        run: devenv shell cargo clippy --workspace --all-targets --all-features

  test-rust:
    name: "Cargo Test (Rust)"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: cachix/install-nix-action@v31
      - uses: cachix/cachix-action@v16
        with:
          name: ${{ secrets.CACHIX_CACHE_NAME || 'roco' }}
          authToken: '${{ secrets.CACHIX_AUTH_TOKEN }}'
          extraPullNames: devenv
      - name: Install devenv
        run: nix profile add nixpkgs#devenv
      - name: Run tests
        run: devenv shell cargo test --workspace

  # ----------------- Node.js Jobs -----------------
  test-node-agent:
    name: "Node.js Local Agent"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'
          cache-dependency-path: apps/node-local-agent/package-lock.json
      - name: Install Dependencies
        run: npm ci
        working-directory: apps/node-local-agent
      - name: Build / Compile
        run: npm run build
        working-directory: apps/node-local-agent
      - name: Run Tests
        run: npm test
        working-directory: apps/node-local-agent

  test-vscode-plugin:
    name: "VS Code Extension"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Cache Node Modules
        uses: actions/cache@v4
        with:
          path: apps/plugins/vscode/node_modules
          key: ${{ runner.os }}-node-vscode-${{ hashFiles('apps/plugins/vscode/package.json') }}
          restore-keys: |
            ${{ runner.os }}-node-vscode-
      - name: Install Dependencies
        run: npm install
        working-directory: apps/plugins/vscode
      - name: Build / Compile
        run: npm run compile
        working-directory: apps/plugins/vscode
      - name: Run Tests
        run: npm test
        working-directory: apps/plugins/vscode
