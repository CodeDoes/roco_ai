[package]
name = "roco-cli"
version.workspace = true
edition.workspace = true

[lib]
name = "roco_cli"
path = "src/lib.rs"

[[bin]]
name = "roco"
path = "src/bin/roco.rs"

[features]
default = ["net"]
# Desktop GUI (egui) without tray icon — works on all systems.
gui = ["dep:eframe", "dep:roco_ui"]
# Desktop GUI with system tray icon (requires glib on Linux).
desktop = ["gui", "dep:tray-icon", "dep:image"]
# HTTP server / gateway / story façade. Off by default — use `roco-inferd` for
# model serving; enable this only when working on the HTTP surface.
net = ["dep:roco-server", "dep:roco-gateway", "dep:axum"]

[dependencies]
roco-engine = { path = "../engine" }

roco-protocol = { path = "../protocol" }
reqwest = { workspace = true, features = ["blocking", "json"] }
roco-agent = { path = "../agent" }
roco-workspace = { path = "../workspace" }
roco-infer-client = { path = "../infer-client" }
roco-app = { path = "../app", package = "roco-app" }
roco-session = { path = "../session" }
# Optional surfaces — not in the fast default path.
roco-server = { path = "../server", optional = true }
roco-gateway = { path = "../gateway", optional = true }
roco_ui = { path = "../ui", package = "roco_ui", optional = true }
axum = { version = "0.7", features = ["macros"], optional = true }
eframe = { version = "0.31", optional = true, default-features = false, features = [
    "accesskit",
    "default_fonts",
    "glow",
    "x11",
    "wayland",
] }
tokio = { workspace = true, features = [
    "io-std",
    "io-util",
    "macros",
    "net",
    "rt",
    "rt-multi-thread",
    "sync",
    "time",
] }
tray-icon = { version = "0.24", optional = true }
image = { version = "0.25", optional = true, default-features = false, features = ["png", "ico"] }
tracing.workspace = true
tracing-subscriber.workspace = true
serde.workspace = true
serde_json.workspace = true
anyhow.workspace = true
futures.workspace = true
chrono = { version = "0.4", features = ["serde"] }
tempfile = "3.10"
